<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GlobeTrotter - Create Trip</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container": "#eeeeec",
                        "inverse-surface": "#2f3130",
                        "surface-container-high": "#e8e8e6",
                        "surface": "#faf9f7",
                        "error": "#ba1a1a",
                        "outline-variant": "#c1c8c4",
                        "on-surface": "#1a1c1b",
                        "secondary-fixed": "#ffdbce",
                        "on-primary-fixed-variant": "#2d4d44",
                        "on-tertiary-container": "#a49c85",
                        "tertiary-fixed-dim": "#cec6ad",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "primary": "#02241d",
                        "on-secondary-fixed": "#370e00",
                        "surface-tint": "#45655b",
                        "on-secondary-container": "#772f0c",
                        "outline": "#717975",
                        "on-surface-variant": "#414846",
                        "tertiary-container": "#393422",
                        "secondary": "#974723",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e3e2e1",
                        "surface-bright": "#faf9f7",
                        "primary-fixed-dim": "#abcec2",
                        "tertiary-fixed": "#ebe2c8",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#1f1c0b",
                        "background": "#faf9f7",
                        "primary-container": "#1a3a32",
                        "inverse-primary": "#abcec2",
                        "on-tertiary-fixed-variant": "#4c4733",
                        "on-secondary-fixed-variant": "#79300e",
                        "on-primary-fixed": "#002019",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#82a499",
                        "surface-container-low": "#f4f4f2",
                        "surface-container-highest": "#e3e2e1",
                        "inverse-on-surface": "#f1f1ef",
                        "secondary-container": "#ff996e",
                        "on-background": "#1a1c1b",
                        "primary-fixed": "#c7eade",
                        "surface-dim": "#dadad8",
                        "secondary-fixed-dim": "#ffb598",
                        "tertiary": "#231f0e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "unit": "8px",
                        "margin-desktop": "48px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "body-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Playfair Display"],
                        "display-lg": ["Playfair Display"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Playfair Display"],
                        "headline-sm": ["Playfair Display"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "body-md": ["Plus Jakarta Sans"]

                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],

                        "display-lg": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-sm": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col pb-24">
<!-- Header -->
<header class="sticky top-0 z-40 bg-surface/90 backdrop-blur-md border-b border-on-surface/5 px-margin-mobile h-16 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-primary tracking-tight">Create Trip</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content -->
<main class="flex-grow px-margin-mobile pt-8 pb-32 max-w-[500px] mx-auto w-full">
<!-- Illustration / Mood -->
<div class="mb-10 w-full h-32 rounded-xl overflow-hidden relative shadow-[0_12px_32px_rgba(26,58,50,0.08)]">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A softly lit, minimalist flat-lay of a premium leather travel journal open to a blank page, resting on a textured linen surface next to an elegant silver fountain pen. The color palette is warm, featuring earthy tones, soft whites, and subtle hints of deep forest green, evoking a sense of anticipation and sophisticated exploration. Light natural window light casts gentle shadows across the scene, embodying a modern editorial travel aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDeVV05kkrsGp8lFTbU1YFVbLFkLhM52wb8KzhcYbA0sUxmbfhvJA6zqDip1bBTWXqsoP5mFddh_SCQI5TGojSVI5CGMG9uT7hnGfVMliM7BL8yaIMv-4aEwnH6bLQijDGZwtR9Z8Q_APCXQYuoSwAFKTmhOkI-ys9lCcMe_dhjbTCFHJ_pNXv-bZDS37Uf767H5wnSMVw_eDMCDy81I7rZCIueJyOOIrtzONZ3Mp_Ndf0vLvSsVye96A')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
</div>
<form class="space-y-8 flex flex-col">
<!-- 1. Name your trip -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="trip-name">Name your trip</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg px-4 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="trip-name" placeholder="e.g., Summer in Provence" type="text"/>
</div>
</div>
<!-- 2. Select dates -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant">Select dates</label>
<div class="flex items-center gap-3">
<div class="flex-1 relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">calendar_today</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface cursor-pointer focus:outline-none focus:border-primary transition-colors" placeholder="Start" readonly="" type="text"/>
</div>
<span class="text-outline-variant material-symbols-outlined">arrow_forward</span>
<div class="flex-1 relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">calendar_today</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface cursor-pointer focus:outline-none focus:border-primary transition-colors" placeholder="End" readonly="" type="text"/>
</div>
</div>
<p class="font-label-sm text-label-sm text-secondary pt-1 flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size: 14px;">schedule</span>
                    Select dates to calculate duration
                </p>
</div>
<hr class="border-t border-outline-variant/30 my-6"/>
<!-- 3. Starting from -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="start-location">Starting from</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">flight_takeoff</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="start-location" placeholder="City or Airport" type="text"/>
</div>
</div>
<!-- 4. Your first stop -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant flex items-center justify-between" for="first-stop">
                    Your first stop
                    <span class="text-outline font-normal text-[10px] uppercase tracking-wider">Optional</span>
</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">location_on</span>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg pl-10 pr-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="first-stop" placeholder="Where to first?" type="text"/>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom CTA -->
<div class="fixed bottom-20 left-0 w-full px-margin-mobile pb-4 bg-gradient-to-t from-background via-background/90 to-transparent z-40 pointer-events-none">
<div class="max-w-[500px] mx-auto pointer-events-auto">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-all shadow-[0_12px_32px_rgba(2,36,29,0.15)] active:scale-[0.98]">
<span>Build My Itinerary</span>
<span class="material-symbols-outlined text-[18px]">magic_button</span>
</button>
</div>
</div>
<!-- BottomNavBar (Suppressed for Create Trip task flow, but requested by prompt structure. Will render as inactive context) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile py-3 md:hidden bg-surface shadow-[0_-4px_12px_rgba(26,58,50,0.04)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all rounded-lg p-2">
<span class="material-symbols-outlined mb-1">explore</span>
<span class="font-label-sm text-label-sm">Discover</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 hover:bg-surface-container-high transition-all">
<span class="material-symbols-outlined mb-1">map</span>
<span class="font-label-sm text-label-sm">Trips</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all rounded-lg p-2">
<span class="material-symbols-outlined mb-1">bookmark</span>
<span class="font-label-sm text-label-sm">Saved</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-all rounded-lg p-2">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</nav>
</body></html>
